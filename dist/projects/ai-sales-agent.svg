      <rect x="1284" y="676" width="240" height="9" rx="4.5" fill="#D8DCE3" />
      <rect x="1284" y="696" width="170" height="9" rx="4.5" fill="#D8DCE3" />

      <rect x="1262" y="766" width="306" height="52" rx="18" fill="#111827" />

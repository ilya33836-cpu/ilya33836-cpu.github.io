<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="NORTH BARBER — лендинг барбершопа">
  <defs>
    <linearGradient id="nb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E0E10" />
      <stop offset="1" stop-color="#18181B" />
    </linearGradient>
    <linearGradient id="nb-photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27272A" />
      <stop offset="1" stop-color="#3F3F46" />
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#nb-bg)" />
  <rect x="0" y="0" width="1600" height="4" fill="#C9A227" />

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="86" y="70" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="4">NORTH</text>
    <text x="86" y="92" font-size="12" fill="#8A8A8F" letter-spacing="5">BARBER SHOP</text>
    <g font-size="13" fill="#B4B4B8" letter-spacing="1">
      <text x="1060" y="76">УСЛУГИ</text>
      <text x="1160" y="76">МАСТЕРА</text>
      <text x="1272" y="76">ЦЕНЫ</text>
      <text x="1360" y="76">КОНТАКТЫ</text>
    </g>
    <rect x="1452" y="48" width="104" height="44" rx="10" fill="#C9A227" />
    <text x="1504" y="76" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="middle" letter-spacing="1">ЗАПИСЬ</text>

    <text x="86" y="300" font-size="110" font-weight="700" fill="#FFFFFF" letter-spacing="-2">BARBER</text>
    <text x="86" y="400" font-size="110" font-weight="700" fill="none" stroke="#C9A227" stroke-width="2" letter-spacing="-2">CRAFT</text>
    <text x="86" y="452" font-size="16" fill="#8A8A8F" letter-spacing="1">МУЖСКАЯ СТРИЖКА · БРИТЬЕ · УХОД</text>
    <rect x="86" y="492" width="230" height="56" rx="8" fill="#C9A227" />
    <text x="201" y="527" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="middle" letter-spacing="1">ЗАПИСАТЬСЯ</text>
    <text x="86" y="590" font-size="14" fill="#8A8A8F">Ежедневно 10:00 — 22:00</text>
    <text x="86" y="616" font-size="14" fill="#8A8A8F">Москва, ул. Покровка, 12</text>

    <rect x="700" y="150" width="420" height="520" rx="12" fill="url(#nb-photo)" />
    <rect x="1140" y="150" width="374" height="250" rx="12" fill="url(#nb-photo)" />
    <rect x="1140" y="420" width="374" height="250" rx="12" fill="#202024" />
    <text x="1166" y="470" font-size="13" fill="#C9A227" letter-spacing="2">MASTER</text>
    <text x="1166" y="520" font-size="30" font-weight="700" fill="#FFFFFF">Артём</text>
    <text x="1166" y="556" font-size="14" fill="#8A8A8F">Опыт 9 лет · классика и текстура</text>
    <rect x="1166" y="592" width="140" height="40" rx="8" fill="none" stroke="#3F3F46" />
    <text x="1236" y="617" font-size="12" font-weight="600" fill="#E4E4E7" text-anchor="middle">Стрижка 1 800 ₽</text>

    <text x="86" y="740" font-size="14" fill="#C9A227" letter-spacing="3">УСЛУГИ И ЦЕНЫ</text>
    <g font-size="15" fill="#E4E4E7">
      <text x="86" y="792">Классическая стрижка</text>
      <text x="620" y="792" fill="#C9A227" text-anchor="end">1 800 ₽</text>
      <line x1="86" y1="812" x2="620" y2="812" stroke="#27272A" />
      <text x="86" y="852">Бритьё бороды</text>
      <text x="620" y="852" fill="#C9A227" text-anchor="end">1 200 ₽</text>
      <line x1="86" y1="872" x2="620" y2="872" stroke="#27272A" />
      <text x="86" y="912">Комплекс «Гость»</text>
      <text x="620" y="912" fill="#C9A227" text-anchor="end">3 200 ₽</text>
      <line x1="86" y1="932" x2="620" y2="932" stroke="#27272A" />
      <text x="86" y="972">Детское стрижка</text>
      <text x="620" y="972" fill="#C9A227" text-anchor="end">1 400 ₽</text>
    </g>

    <rect x="700" y="740" width="814" height="200" rx="12" fill="#18181B" stroke="#27272A" />
    <text x="732" y="786" font-size="14" fill="#8A8A8F" letter-spacing="2">ЗАПИСЬ ОНЛАЙН</text>
    <rect x="732" y="812" width="230" height="48" rx="8" fill="#0E0E10" stroke="#27272A" />
    <text x="756" y="842" font-size="14" fill="#71717A">Имя</text>
    <rect x="978" y="812" width="230" height="48" rx="8" fill="#0E0E10" stroke="#27272A" />
    <text x="1002" y="842" font-size="14" fill="#71717A">Телефон</text>
    <rect x="1224" y="812" width="258" height="48" rx="8" fill="#C9A227" />
    <text x="1353" y="842" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="middle">ЗАПИСАТЬСЯ</text>
    <text x="732" y="900" font-size="12" fill="#52525B">Или напишите в Telegram — ответим за 5 минут</text>
  </g>
</svg>
